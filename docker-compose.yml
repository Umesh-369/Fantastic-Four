services:
  application-service:
    build:
      context: .
      dockerfile: services/application-service/Dockerfile
    container_name: sahaj-app-service
    ports:
      - "8001:8001"
    volumes:
      - ./data/app_data:/app/data
    environment:
      - APPLICATION_DB_PATH=/app/data/application_service.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  credit-engine:
    build:
      context: .
      dockerfile: services/credit-engine/Dockerfile
    container_name: sahaj-credit-engine
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rule-service:
    build:
      context: .
      dockerfile: services/rule-service/Dockerfile
    container_name: sahaj-rule-service
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  explanation-service:
    build:
      context: .
      dockerfile: services/explanation-service/Dockerfile
    container_name: sahaj-explanation-service
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    container_name: sahaj-audit-service
    ports:
      - "8005:8005"
    volumes:
      - ./data/audit_data:/app/data
    environment:
      - AUDIT_DB_PATH=/app/data/audit_service.db
      - CREDIT_ENGINE_URL=http://credit-engine:8002
      - RULE_SERVICE_URL=http://rule-service:8003
    depends_on:
      credit-engine:
        condition: service_healthy
      rule-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  fairness-service:
    build:
      context: .
      dockerfile: services/fairness-service/Dockerfile
    container_name: sahaj-fairness-service
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: sahaj-gateway
    ports:
      - "8000:8000"
    environment:
      - APPLICATION_SERVICE_URL=http://application-service:8001
      - CREDIT_ENGINE_URL=http://credit-engine:8002
      - RULE_SERVICE_URL=http://rule-service:8003
      - EXPLANATION_SERVICE_URL=http://explanation-service:8004
      - AUDIT_SERVICE_URL=http://audit-service:8005
      - FAIRNESS_SERVICE_URL=http://fairness-service:8006
    depends_on:
      application-service:
        condition: service_healthy
      credit-engine:
        condition: service_healthy
      rule-service:
        condition: service_healthy
      explanation-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sahaj-frontend
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
